<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Campus{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body class="public-body">
    {% block content %}{% endblock %}
    <div class="page-loading" data-page-loading hidden aria-live="polite" aria-busy="true">
      <div class="loading-panel">
        <span class="loading-bar"></span>
        <span class="loading-line wide"></span>
        <span class="loading-line"></span>
        <span class="loading-line short"></span>
      </div>
    </div>
    <script src="/static/js/global-loading.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
